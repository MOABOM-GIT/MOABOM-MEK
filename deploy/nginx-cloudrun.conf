# Cloud Run — 로컬 default.conf 와 동일한 Laravel-first 규칙 ( *.js regex 가로채기 금지 )
#
# Reverb(Pusher) 는 /app/{REVERB_APP_KEY} 만 프록시. 셸 SPA 앱 경로(/app/create-app 등)는 Laravel.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml;

    location ^~ /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /pwa/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /payment/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /build/ {
        # Includes /build/core/template-engine.min.js; gzip_types above keeps the core engine compressed.
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /app/moabom-laravel-key {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_pass http://127.0.0.1:6001;
    }

    location ^~ /app/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ /\. {
        deny all;
    }
}
