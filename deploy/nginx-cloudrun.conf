# Cloud Run — 로컬 default.conf 와 동일한 Laravel-first 규칙 ( *.js regex 가로채기 금지 )

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml;

    location ^~ /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /pwa/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /payment/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /build/ {
        # Includes /build/core/template-engine.min.js; gzip_types above keeps the core engine compressed.
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Laravel Reverb (Pusher protocol) — 클라이언트 wss://host:443/app/{key}
    # Moabom 셸 SPA 도 /app/{id} (예: generated-app-8, create-app) 를 쓰므로
    # WebSocket Upgrade 가 아닌 일반 HTTP(직접 URL·공유 링크)는 Laravel 로 보낸다.
    location ^~ /app/ {
        if ($http_upgrade != "websocket") {
            rewrite ^ /index.php?$query_string last;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_pass http://127.0.0.1:6001;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ /\. {
        deny all;
    }
}
