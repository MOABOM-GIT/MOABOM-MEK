# Cloud Run — 로컬 default.conf 와 동일한 Laravel-first 규칙 ( *.js regex 가로채기 금지 )
#
# Reverb(Pusher)는 realtime.mek360.com VM이 SSOT입니다. Cloud Run은 셸 SPA 앱 경로만 처리합니다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml;

    location ^~ /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /pwa/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /payment/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /build/ {
        # Includes /build/core/template-engine.min.js; gzip_types above keeps the core engine compressed.
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /app/moabom-laravel-key {
        return 404;
    }

    location ^~ /app/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        # Cloud Run 요청 timeout(3600s)보다 짧되, 기본 60s 로 "upstream timed out" 이
        # 자주 나던 셸 부트·크레딧 조회를 완화. 장시간 작업은 별도 Job 경로.
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
