# Cloud Run — 로컬 default.conf 와 동일한 Laravel-first 규칙 ( *.js regex 가로채기 금지 )
#
# Reverb(Pusher)는 realtime.mek360.com VM이 SSOT입니다. Cloud Run은 셸 SPA 앱 경로만 처리합니다.
#
# 확장 dist·prebuilt 번들은 PHP 없이 nginx 정적 서빙 (TTFB 병목 제거).
# miss / 비허용 경로는 @laravel_front_controller → index.php.
#
# 주의: regex location 의 $1/$2 는 if 이후 소실됨 → named capture 필수.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml
        font/woff2
        application/font-woff2;

    # --- 확장 dist 정적 fast-path (same-origin /api/.../assets, PHP 우회) ---
    # templates: URL path → templates/{id}/dist/{path}
    # if 금지 — try_files 와 공존 시 정적 서빙이 깨짐. traversal 은 문자 클래스로 차단.
    location ~ ^/api/templates/assets/(?<ext_id>[A-Za-z0-9._-]+)/(?<asset_path>[A-Za-z0-9][A-Za-z0-9._/-]*)$ {
        root /var/www/html;
        try_files /templates/$ext_id/dist/$asset_path @laravel_front_controller;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        etag on;
    }

    # components.json — 디스크 정적 (PHP·DB 우회). raw JSON (API 와 동일).
    location ~ ^/api/templates/(?<tpl_id>[A-Za-z0-9._-]+)/components\.json$ {
        root /var/www/html;
        default_type application/json;
        try_files /templates/$tpl_id/components.json @laravel_front_controller;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        etag on;
    }

    # lang/*.json — entrypoint warm 병합본 (public/ext-static/lang). miss 시 PHP serveLanguage.
    location ~ ^/api/templates/(?<tpl_id>[A-Za-z0-9._-]+)/lang/(?<locale>[a-z][a-z])\.json$ {
        root /var/www/html/public;
        default_type application/json;
        try_files /ext-static/lang/$tpl_id/$locale.json @laravel_front_controller;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        etag on;
    }

    # modules/plugins: URL path 가 dist/… 포함 (Laravel serveAsset 과 동일)
    location ~ ^/api/modules/assets/(?<ext_id>[A-Za-z0-9._-]+)/(?<asset_path>[A-Za-z0-9][A-Za-z0-9._/-]*)$ {
        root /var/www/html;
        try_files /modules/$ext_id/$asset_path @laravel_front_controller;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        etag on;
    }

    location ~ ^/api/plugins/assets/(?<ext_id>[A-Za-z0-9._-]+)/(?<asset_path>[A-Za-z0-9][A-Za-z0-9._/-]*)$ {
        root /var/www/html;
        try_files /plugins/$ext_id/$asset_path @laravel_front_controller;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        etag on;
    }

    # prebuilt 병합 번들 (ext-bundles:warm-static → public/ext-static/)
    location = /api/modules/bundle.js {
        root /var/www/html/public;
        try_files /ext-static/modules.bundle.js @laravel_front_controller;
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /api/modules/bundle.css {
        root /var/www/html/public;
        try_files /ext-static/modules.bundle.css @laravel_front_controller;
        default_type text/css;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /api/plugins/bundle.js {
        root /var/www/html/public;
        try_files /ext-static/plugins.bundle.js @laravel_front_controller;
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /api/plugins/bundle.css {
        root /var/www/html/public;
        try_files /ext-static/plugins.bundle.css @laravel_front_controller;
        default_type text/css;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location @laravel_front_controller {
        rewrite ^ /index.php last;
    }

    # ^~ 제거: regex 정적 fast-path(templates/modules/plugins assets)가 평가되도록.
    # (예전 *.js regex 가로채기 방지용 ^~ 는 더 이상 필요 없음)
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /pwa/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /payment/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /build/ {
        # Includes /build/core/template-engine.min.js; gzip_types above keeps the core engine compressed.
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /app/moabom-laravel-key {
        return 404;
    }

    location ^~ /app/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        # Cloud Run 요청 timeout(3600s)보다 짧되, 기본 60s 로 "upstream timed out" 이
        # 자주 나던 셸 부트·크레딧 조회를 완화. 장시간 작업은 별도 Job 경로.
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
