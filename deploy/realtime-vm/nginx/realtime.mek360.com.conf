# Moabom realtime VM — realtime.mek360.com
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_moabom_metrics_token $moabom_metrics_auth {
    default 0;
    include /etc/nginx/moabom-metrics-token.map;
}

server {
    listen 80;
    server_name realtime.mek360.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name realtime.mek360.com;

    ssl_certificate     /etc/letsencrypt/live/realtime.mek360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realtime.mek360.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    access_log /var/log/nginx/moabom-realtime.access.log;
    error_log  /var/log/nginx/moabom-realtime.error.log;

    location ^~ /app/moabom-laravel-key {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_pass http://127.0.0.1:6001;
    }

    location ^~ /apps/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:6001;
    }

    location = /internal/vm-metrics {
        if ($moabom_metrics_auth = 0) {
            return 403;
        }
        include fastcgi_params;
        fastcgi_pass unix:/run/fcgiwrap.socket;
        fastcgi_param SCRIPT_FILENAME /opt/moabom-realtime/metrics/moabom-vm-metrics.sh;
        gzip off;
    }

    location / {
        return 404;
    }
}
