; Moabom Cloud Run PHP-FPM pool overlay (RF-18 / auth burst)
; Baked into the image — overrides php:8.4-fpm-bookworm www defaults (max_children=5).
; Keep in sync with deploy/lib/cloud-run-service-flags.sh --concurrency=8 and --memory=2Gi.
[www]
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
request_terminate_timeout = 120s
