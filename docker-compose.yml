# 공통 스택 정의 (로컬·CI·문서 기준).
# 로컬 개발: docker-compose.override.yml 이 자동 병합됩니다 (WSL + named volume).
# Cloud Run: deploy/Dockerfile 로 별도 이미지 빌드 (bind mount 없음).

services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: moabom_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
    depends_on:
      db:
        condition: service_healthy
    networks:
      - moabomnet

  nginx:
    image: nginx:1.27-alpine
    container_name: moabom_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - moabomnet

  db:
    image: mysql:8.0
    container_name: moabom_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moabom_db}
      MYSQL_USER: ${MYSQL_USER:-moabom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - moabom_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - moabomnet

  reverb:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: moabom_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_PORT:-8081}:8080"
    environment:
      APP_ENV: local
      BROADCAST_CONNECTION: reverb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - moabomnet

volumes:
  moabom_mysql_data:
  moabom_vendor:
  moabom_node_modules:

networks:
  moabomnet:
