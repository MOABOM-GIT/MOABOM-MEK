# Moabom 로컬 nginx — 규칙: Laravel 동적 URL은 prefix 로 PHP에 넘기고,
# 확장자 기반 regex location 으로 *.js/*.css 를 막지 않는다 ( /pwa/sw.js 404 회귀 방지).

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    absolute_redirect off;
    port_in_redirect off;

    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml;

    # --- Laravel 동적 경로 (우선순위: ^~ prefix) ---
    location ^~ /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /pwa/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /payment/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- public 디스크 정적 (경로 한정, 없으면 404 — Laravel 로 넘기지 않음) ---
    location ^~ /build/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
    }

    location ~ /\. {
        deny all;
    }
}
