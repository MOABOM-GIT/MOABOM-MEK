# Moabom 로컬 nginx — Cloud Run nginx-cloudrun.conf 와 동일 정적 fast-path.
# regex location 의 $1/$2 는 if 이후 소실 → named capture 사용.

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    absolute_redirect off;
    port_in_redirect off;

    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml
        font/woff2
        application/font-woff2;

    location ~ ^/api/templates/assets/(?<ext_id>[A-Za-z0-9._-]+)/(?<asset_path>[A-Za-z0-9][A-Za-z0-9._/-]*)$ {
        root /var/www/html;
        try_files /templates/$ext_id/dist/$asset_path @laravel_front_controller;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        etag on;
    }

    location ~ ^/api/templates/(?<tpl_id>[A-Za-z0-9._-]+)/components\.json$ {
        root /var/www/html;
        default_type application/json;
        try_files /templates/$tpl_id/components.json @laravel_front_controller;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        etag on;
    }

    location ~ ^/api/templates/(?<tpl_id>[A-Za-z0-9._-]+)/lang/(?<locale>[a-z][a-z])\.json$ {
        root /var/www/html/public;
        default_type application/json;
        try_files /ext-static/lang/$tpl_id/$locale.json @laravel_front_controller;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
        etag on;
    }

    location ~ ^/api/modules/assets/(?<ext_id>[A-Za-z0-9._-]+)/(?<asset_path>[A-Za-z0-9][A-Za-z0-9._/-]*)$ {
        root /var/www/html;
        try_files /modules/$ext_id/$asset_path @laravel_front_controller;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        etag on;
    }

    location ~ ^/api/plugins/assets/(?<ext_id>[A-Za-z0-9._-]+)/(?<asset_path>[A-Za-z0-9][A-Za-z0-9._/-]*)$ {
        root /var/www/html;
        try_files /plugins/$ext_id/$asset_path @laravel_front_controller;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        etag on;
    }

    location = /api/modules/bundle.js {
        root /var/www/html/public;
        try_files /ext-static/modules.bundle.js @laravel_front_controller;
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /api/modules/bundle.css {
        root /var/www/html/public;
        try_files /ext-static/modules.bundle.css @laravel_front_controller;
        default_type text/css;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /api/plugins/bundle.js {
        root /var/www/html/public;
        try_files /ext-static/plugins.bundle.js @laravel_front_controller;
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /api/plugins/bundle.css {
        root /var/www/html/public;
        try_files /ext-static/plugins.bundle.css @laravel_front_controller;
        default_type text/css;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location @laravel_front_controller {
        rewrite ^ /index.php last;
    }

    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /pwa/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /payment/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /build/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
    }

    location ~ /\. {
        deny all;
    }
}
